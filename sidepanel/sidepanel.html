<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT English Daily Split-View (19:00 Reminder)</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="app-container" id="app-container">
    <!-- 19:00 ALARM REMINDER BANNER (Hidden unless alarm fires) -->
    <section id="alarm-banner" class="alarm-banner hidden" role="region" aria-label="19:00 Reminder Banner">
      <div class="banner-content">
        <div class="banner-text">
          <strong>Đến giờ luyện hội thoại Phỏng vấn IT!</strong>
          <span class="banner-subtext">1 phút mỗi tối.</span>
        </div>
      </div>
      <div class="banner-actions">
        <button type="button" id="btn-snooze-15" class="btn btn-icon-only btn-secondary btn-sm" title="Hoãn báo lại sau 15 phút" aria-label="Hoãn 15 phút">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        </button>
        <button type="button" id="btn-dismiss-banner" class="btn btn-icon-only btn-ghost btn-sm" title="Đóng" aria-label="Đóng">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
    </section>

    <!-- MINIMAL TOP BAR (Icon-only actions on right) -->
    <header class="app-header">
      <div class="header-top">
        <div class="brand-cluster">
          <div class="streak-badge" id="streak-badge" title="Chuỗi ngày học">
            <svg class="streak-icon" width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c1.5 3.5 4 5.5 4 9a4 4 0 0 1-8 0c0-1.5.5-3 1.5-4.5C8 8 6 10.5 6 13.5A6 6 0 0 0 18 13.5C18 8.5 14.5 5 12 2z"/></svg>
            <span id="streak-count" class="streak-count">0 ngày</span>
          </div>
          <span id="current-index-display" class="index-display">1 / 17</span>
        </div>

        <div class="header-quick-actions">
          <button type="button" id="btn-trigger-split" hidden class="btn btn-accent btn-sm" title="Test 19:00" aria-label="Test 19:00">⚡</button>
          <button type="button" id="btn-snooze-header" class="btn btn-icon-only btn-ghost btn-sm" title="Hoãn nhắc nhở 15 phút" aria-label="Hoãn nhắc nhở 15 phút">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          </button>
          <button type="button" id="btn-toggle-settings" class="btn btn-icon-only btn-ghost btn-sm" title="Cài đặt lịch hẹn 19:00" aria-label="Cài đặt lịch hẹn 19:00">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>
      </div>

      <!-- POPOVER SCHEDULE SETTINGS (Toggled by gear icon button) -->
      <details id="schedule-details" class="schedule-details">
        <summary class="sr-only">
          <span id="next-alarm-display" class="next-alarm-text">Hẹn giờ: 19:00</span>
          <span id="daily-progress-text" class="progress-counter">0 / 5 câu</span>
        </summary>
        <div class="schedule-panel">
          <div class="daily-progress-container">
            <div class="progress-track" role="progressbar" aria-label="Tiến độ" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0">
              <div id="daily-progress-bar" class="progress-fill" style="transform: scaleX(0);"></div>
            </div>
          </div>
          <div class="form-row">
            <label for="schedule-morning-time-input" class="form-label">Ca sáng:</label>
            <input type="time" id="schedule-morning-time-input" class="time-input" value="09:00">
          </div>
          <div class="form-row">
            <label for="schedule-time-input" class="form-label">Chiều muộn:</label>
            <input type="time" id="schedule-time-input" class="time-input" value="19:00">
          </div>
          <div class="form-row">
            <label for="schedule-enabled-toggle" class="form-label">Tự động bật:</label>
            <input type="checkbox" id="schedule-enabled-toggle" class="toggle-checkbox" checked>
          </div>
          <div class="form-row">
            <label for="schedule-display-mode" class="form-label">Chế độ mở:</label>
            <select id="schedule-display-mode" class="time-input">
              <option value="split">Chia đôi màn hình</option>
              <option value="sidePanel">Side panel</option>
            </select>
          </div>
          <div class="form-actions">
            <button type="button" id="btn-save-schedule" class="btn btn-icon-only btn-primary btn-sm" title="Lưu cấu hình" aria-label="Lưu cấu hình">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
            </button>
            <span id="schedule-status-msg" class="status-msg" aria-live="polite"></span>
          </div>
        </div>
      </details>

      <!-- TOPIC PILLS -->
      <nav class="category-nav" aria-label="Chủ đề Phỏng vấn và Công việc IT">
        <div id="category-tabs" class="category-tabs" role="tablist"></div>
      </nav>
    </header>

    <!-- MAIN WORKSPACE: ILLUSTRATED IT INTERVIEW DIALOGUE CARD -->
    <main class="study-workspace">
      <article id="hero-sentence-card" class="card hero-card" aria-label="Thẻ hội thoại phỏng vấn IT">
        <!-- 1. VISUAL SCENE ILLUSTRATION (Real visual scene, zero technical text boxes!) -->
        <div class="scene-illustration-wrap">
          <img id="scene-illustration-img" class="scene-illustration-img" src="../assets/interview-scene.jpg" alt="Minh họa buổi phỏng vấn IT">
          <div id="scene-illustration" class="scene-illustration" aria-hidden="true" hidden></div>
          <div class="scene-overlay-badges">
            <span id="sentence-topic-badge" class="badge badge-topic">Phỏng vấn IT</span>
            <span id="sentence-level-badge" class="badge badge-level">B2</span>
            <span id="sentence-mastered-indicator" class="mastered-pill hidden">✓ Đã thuộc</span>
          </div>
        </div>

        <!-- 2. INTERVIEWER QUESTION + PERSONALIZABLE CANDIDATE ANSWER -->
        <div id="card-dialogue" class="interview-dialogue-flow" aria-label="Đoạn hội thoại phỏng vấn">
          <p id="dialogue-scenario" class="sr-only" hidden></p>

          <!-- Turn A: Interviewer Question -->
          <div class="chat-bubble chat-speaker-a">
            <div class="speaker-header">
              <span class="speaker-avatar speaker-avatar-a" aria-hidden="true">Q</span>
              <span id="speaker-a-label" class="speaker-role">Interviewer</span>
              <button type="button" id="btn-tts-question" class="btn-icon-circle btn-icon-sm" title="Nghe câu hỏi" aria-label="Nghe câu hỏi">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>
              </button>
            </div>
            <p id="dialogue-speaker-a" class="chat-line chat-question-line"></p>
          </div>

          <!-- Turn B: Candidate / Your Personalizable Response -->
          <div class="chat-bubble chat-speaker-b">
            <div class="speaker-header">
              <span class="speaker-avatar speaker-avatar-b" aria-hidden="true">A</span>
              <span id="speaker-b-label" class="speaker-role">You</span>
              <span id="personalized-badge" class="personalized-tag" hidden>Đã cá nhân hóa</span>
              <button type="button" id="btn-personalize-answer" class="btn-icon-circle btn-icon-sm btn-edit-answer" title="Cá nhân hóa câu trả lời theo kinh nghiệm của bạn" aria-label="Cá nhân hóa câu trả lời">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
              </button>
            </div>

            <!-- Read View of Answer -->
            <h1 id="sentence-english" class="sentence-english" title="Bấm để cá nhân hóa câu trả lời của bạn">Loading...</h1>
            <p id="dialogue-speaker-b" class="sr-only" hidden></p>
            <p id="card-vietnamese" class="hero-vietnamese"></p>

            <!-- Inline Personalization Editor (Toggled by ✏️ or clicking the answer) -->
            <div id="personalize-editor" class="personalize-editor" hidden>
              <div class="preset-chips" id="preset-chips" aria-label="Gợi ý theo stack của bạn">
                <button type="button" class="chip-btn" data-preset="backend">Django / Python</button>
                <button type="button" class="chip-btn" data-preset="frontend">Next.js / React</button>
                <button type="button" class="chip-btn" data-preset="mobile">Flutter / Mobile</button>
                <button type="button" class="chip-btn" data-preset="fullstack">Tech Lead / AI</button>
              </div>
              <input type="text" id="personalize-question-input" class="personalize-input" placeholder="Tùy chỉnh câu hỏi phỏng vấn (Interviewer Q)..." aria-label="Tùy chỉnh câu hỏi phỏng vấn">
              <textarea id="personalize-textarea" class="personalize-textarea" rows="3" placeholder="Nhập câu trả lời theo dự án thực tế của bạn..." aria-label="Nhập câu trả lời cá nhân hóa của bạn"></textarea>
              <div class="personalize-actions">
                <button type="button" id="btn-add-custom-card" class="btn-icon-circle btn-icon-sm" title="Thêm thành thẻ câu hỏi mới của riêng tôi" aria-label="Thêm thẻ câu hỏi mới">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
                <button type="button" id="btn-reset-answer" class="btn-icon-circle btn-icon-sm" title="Khôi phục câu mẫu gốc" aria-label="Khôi phục câu mẫu gốc">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                </button>
                <button type="button" id="btn-save-answer" class="btn-icon-circle btn-icon-sm btn-save-custom" title="Lưu câu hỏi & câu trả lời của tôi" aria-label="Lưu câu trả lời của tôi">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- 3. ICON-ONLY AUDIO & INFO ACTION BAR -->
        <div class="tts-controller">
          <div class="tts-buttons">
            <button type="button" id="btn-tts-normal" class="btn-icon-circle btn-audio-main btn-audio" title="Nghe phát âm (1.0x)" aria-label="Nghe phát âm 1.0x">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>
            </button>
            <button type="button" id="btn-tts-slow" class="btn-icon-circle btn-audio-slow btn-audio" title="Nghe chậm (0.8x Shadowing)" aria-label="Nghe chậm 0.8x">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            </button>
            <button type="button" id="btn-tts-dialogue" class="btn-icon-circle btn-audio-slow" title="Nghe trọn vẹn cuộc hội thoại Hỏi - Đáp" aria-label="Nghe cả hội thoại Hỏi Đáp">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </button>
            <button type="button" id="btn-toggle-details" class="btn-icon-circle btn-audio-slow" title="Xem phiên âm IPA, từ khóa & mẹo phỏng vấn" aria-label="Xem phiên âm và từ khóa">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
            </button>
          </div>

          <div id="audio-wave" class="audio-wave" aria-hidden="true">
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
          </div>
        </div>

        <!-- OPTIONAL INFO SHEET (Toggled by ℹ️ icon button, completely invisible by default!) -->
        <div id="extra-info-panel" class="extra-info-panel" hidden>
          <div id="sentence-ipa" class="sentence-ipa">/.../</div>
          <ul id="card-key-chunks" class="key-chunks-list"></ul>
          <div class="stress-box">
            <div id="sentence-stress" class="sentence-stress"></div>
            <div id="sentence-intonation" class="sentence-stress sentence-intonation" hidden></div>
          </div>
          <div class="instead-of-box">
            <div id="sentence-instead-of" class="sentence-instead-of"></div>
          </div>
          <div id="card-alternatives" class="alternatives-grid">
            <div class="alt-card alt-casual">
              <span class="alt-badge">Casual</span>
              <p id="alt-casual-text" class="alt-text"></p>
            </div>
            <div class="alt-card alt-formal">
              <span class="alt-badge">Formal</span>
              <p id="alt-formal-text" class="alt-text"></p>
            </div>
          </div>
          <div id="card-pro-tip" class="tip-card">
            <p id="card-nuance" class="body-text nuance-text"></p>
            <p id="pro-tip-text" class="pro-tip-text"></p>
          </div>
        </div>
      </article>
    </main>

    <!-- BOTTOM DOCK: Icon-only Prev/Next, ONLY Mastered button has text! -->
    <footer class="app-footer">
      <div class="nav-controls">
        <button type="button" id="btn-prev" class="btn-icon-circle btn-nav" title="Hội thoại trước" aria-label="Hội thoại trước">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>

        <button type="button" id="btn-mark-mastered" class="btn btn-mastered" title="Đánh dấu đã thuộc">
          <span class="btn-fire-icon" aria-hidden="true">✓</span>
          <span id="mark-mastered-label">Đã thuộc</span>
        </button>

        <button type="button" id="btn-next" class="btn-icon-circle btn-nav" title="Hội thoại tiếp theo" aria-label="Hội thoại tiếp theo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </footer>
  </div>

  <canvas id="confetti-canvas" class="confetti-canvas" aria-hidden="true"></canvas>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
