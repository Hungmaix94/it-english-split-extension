<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT English Daily Split-View (19:00 Reminder)</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="app-container" id="app-container">
    <!-- 19:00 ALARM REMINDER BANNER (Hidden unless alarm fires) -->
    <section id="alarm-banner" class="alarm-banner hidden" role="region" aria-label="19:00 Reminder Banner">
      <div class="banner-content">
        <div class="banner-text">
          <strong>Đến giờ luyện 1 câu IT English!</strong>
          <span class="banner-subtext">1 phút mỗi tối.</span>
        </div>
      </div>
      <div class="banner-actions">
        <button type="button" id="btn-snooze-15" class="btn btn-secondary btn-sm">Hoãn 15p</button>
        <button type="button" id="btn-dismiss-banner" class="btn btn-ghost btn-sm" aria-label="Đóng">✕</button>
      </div>
    </section>

    <!-- MINIMAL TOP BAR: Only Streak + Counter + Snooze -->
    <header class="app-header">
      <div class="header-top">
        <div class="brand-cluster">
          <div class="streak-badge" id="streak-badge" title="Chuỗi ngày học">
            <svg class="streak-icon" width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c1.5 3.5 4 5.5 4 9a4 4 0 0 1-8 0c0-1.5.5-3 1.5-4.5C8 8 6 10.5 6 13.5A6 6 0 0 0 18 13.5C18 8.5 14.5 5 12 2z"/></svg>
            <span id="streak-count" class="streak-count">0 ngày</span>
          </div>
          <span id="current-index-display" class="index-display">Câu 1 / 17</span>
        </div>

        <div class="header-quick-actions">
          <button type="button" id="btn-trigger-split" hidden class="btn btn-accent btn-sm">Test 19:00</button>
          <button type="button" id="btn-snooze-header" class="btn btn-ghost btn-sm" title="Hoãn 15 phút">Hoãn 15p</button>
        </div>
      </div>

      <!-- TOPIC PILLS -->
      <nav class="category-nav" aria-label="5 Chủ đề IT">
        <div id="category-tabs" class="category-tabs" role="tablist"></div>
      </nav>
    </header>

    <!-- ZEN FLASHCARD WORKSPACE: ONLY 1 SENTENCE + 1 MEANING + AUDIO -->
    <main class="study-workspace">
      <article id="hero-sentence-card" class="card hero-card" aria-label="Thẻ câu giao tiếp">
        <div class="card-meta">
          <span id="sentence-topic-badge" class="badge badge-topic">Daily Standup</span>
          <span id="sentence-level-badge" class="badge badge-level">B2</span>
          <span id="sentence-mastered-indicator" class="mastered-pill hidden">✓ Đã thuộc</span>
        </div>

        <div class="sentence-hero-content">
          <h1 id="sentence-english" class="sentence-english">Loading...</h1>
          <p id="card-vietnamese" class="hero-vietnamese"></p>
        </div>

        <div class="tts-controller">
          <div class="tts-buttons">
            <button type="button" id="btn-tts-normal" class="btn btn-audio">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>
              <span>Nghe 1.0x</span>
            </button>
            <button type="button" id="btn-tts-slow" class="btn btn-audio btn-audio-slow">
              <span>0.8x</span>
            </button>
          </div>

          <div id="audio-wave" class="audio-wave" aria-hidden="true">
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
          </div>
        </div>
      </article>

      <!-- SINGLE MINIMAL DISCLOSURE PILL: Everything else is tucked away here -->
      <details id="deep-dive-drawer" class="deep-dive-drawer">
        <summary class="deep-dive-summary">
          <span>Chi tiết · Phiên âm · Hội thoại · Hẹn giờ</span>
          <span class="deep-dive-chevron" aria-hidden="true">▾</span>
        </summary>

        <div class="deep-dive-content">
          <!-- IPA & STRESS -->
          <section class="card detail-card" aria-label="Phiên âm và ngữ điệu">
            <div id="sentence-ipa" class="sentence-ipa">/.../</div>
            <div class="stress-box">
              <div id="sentence-stress" class="sentence-stress"></div>
              <div id="sentence-intonation" class="sentence-stress sentence-intonation" hidden></div>
            </div>
            <div class="instead-of-box">
              <div class="instead-title">Thay vì nói đơn giản</div>
              <div id="sentence-instead-of" class="sentence-instead-of"></div>
            </div>
          </section>

          <!-- KEY CHUNKS & ALTERNATIVES -->
          <section class="card detail-card" aria-label="Cụm từ và biến thể">
            <ul id="card-key-chunks" class="key-chunks-list"></ul>
            <div id="card-alternatives" class="alternatives-grid">
              <div class="alt-card alt-casual">
                <span class="alt-badge">Casual</span>
                <p id="alt-casual-text" class="alt-text"></p>
              </div>
              <div class="alt-card alt-formal">
                <span class="alt-badge">Formal</span>
                <p id="alt-formal-text" class="alt-text"></p>
              </div>
            </div>
          </section>

          <!-- DIALOGUE & TIP -->
          <section id="card-dialogue" class="card detail-card" aria-label="Hội thoại mẫu">
            <p id="dialogue-scenario" class="scenario-banner"></p>
            <div class="dialogue-chat">
              <div class="chat-bubble chat-speaker-a">
                <span id="speaker-a-label" class="speaker-role">A</span>
                <p id="dialogue-speaker-a" class="chat-line"></p>
              </div>
              <div class="chat-bubble chat-speaker-b">
                <span id="speaker-b-label" class="speaker-role">B</span>
                <p id="dialogue-speaker-b" class="chat-line"></p>
              </div>
            </div>
          </section>

          <section id="card-pro-tip" class="card detail-card tip-card" aria-label="Mẹo phỏng vấn">
            <p id="card-nuance" class="body-text nuance-text"></p>
            <p id="pro-tip-text" class="pro-tip-text"></p>
          </section>

          <!-- SCHEDULE SETTINGS & DAILY GOAL -->
          <details id="schedule-details" class="card detail-card schedule-details" open>
            <summary class="schedule-summary">
              <span id="next-alarm-display" class="next-alarm-text">Hẹn giờ: 19:00</span>
              <span id="daily-progress-text" class="progress-counter">0 / 5 câu</span>
            </summary>
            <div class="daily-progress-container">
              <div class="progress-track" role="progressbar" aria-label="Tiến độ" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0">
                <div id="daily-progress-bar" class="progress-fill" style="transform: scaleX(0);"></div>
              </div>
            </div>
            <div class="schedule-panel">
              <div class="form-row">
                <label for="schedule-time-input" class="form-label">Giờ nhắc:</label>
                <input type="time" id="schedule-time-input" class="time-input" value="19:00">
              </div>
              <div class="form-row">
                <label for="schedule-enabled-toggle" class="form-label">Tự động bật:</label>
                <input type="checkbox" id="schedule-enabled-toggle" class="toggle-checkbox" checked>
              </div>
              <div class="form-row">
                <label for="schedule-display-mode" class="form-label">Khi đến giờ:</label>
                <select id="schedule-display-mode" class="time-input">
                  <option value="split">Chia đôi màn hình</option>
                  <option value="sidePanel">Side panel</option>
                </select>
              </div>
              <div class="form-actions">
                <button type="button" id="btn-save-schedule" class="btn btn-primary btn-sm">Lưu cấu hình</button>
                <span id="schedule-status-msg" class="status-msg" aria-live="polite"></span>
              </div>
            </div>
          </details>
        </div>
      </details>
    </main>

    <!-- CLEAN 3-BUTTON BOTTOM BAR -->
    <footer class="app-footer">
      <div class="nav-controls">
        <button type="button" id="btn-prev" class="btn btn-nav" title="Câu trước">← Trước</button>
        <button type="button" id="btn-mark-mastered" class="btn btn-mastered">
          <span class="btn-fire-icon" aria-hidden="true">✓</span>
          <span id="mark-mastered-label">Đã thuộc</span>
        </button>
        <button type="button" id="btn-next" class="btn btn-nav" title="Câu tiếp">Tiếp →</button>
      </div>
    </footer>
  </div>

  <canvas id="confetti-canvas" class="confetti-canvas" aria-hidden="true"></canvas>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
